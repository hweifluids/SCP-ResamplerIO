name: Module CI

on:
  workflow_dispatch:
    inputs:
      run_build:
        description: "Run the module install.sh CPU smoke build"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  pull_request:
  push:
    branches:
      - main
      - master
      - harveytan

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
    steps:
      - name: Checkout module
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Validate shell scripts
        shell: bash
        run: |
          find . -maxdepth 3 -type f -name '*.sh' -print0 | xargs -0 -r bash -n

      - name: Cache vcpkg binary archives
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_build == 'true' }}
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg/archives
          key: module-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}

      - name: Run manual CPU smoke build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_build == 'true' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            git \
            ninja-build \
            pkg-config \
            python3 \
            tar \
            unzip \
            zip
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          if bash ./install.sh --help 2>&1 | grep -q -- '--component'; then
            bash ./install.sh --component all --build-mode cpu-only
          else
            bash ./install.sh
          fi
